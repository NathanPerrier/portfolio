<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Page not found | Nathan Perrier</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #111;
        color: #f4f4f4;
      }

      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        place-items: center;
      }

      main {
        width: min(36rem, calc(100% - 3rem));
        padding: 2.5rem;
        border: 2px solid #f4f4f4;
        box-shadow: 0.5rem 0.5rem 0 #e94560;
      }

      h1 {
        margin-top: 0;
        font-size: clamp(2rem, 8vw, 4rem);
      }

      p {
        line-height: 1.55;
      }

      nav {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
        margin-top: 1.75rem;
      }

      a {
        padding: 0.7rem 1rem;
        border: 2px solid currentColor;
        color: inherit;
        font-weight: 700;
        text-decoration: none;
      }

      a:hover,
      a:focus-visible {
        background: #f4f4f4;
        color: #111;
        outline: 3px solid #6ee7b7;
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <p aria-hidden="true">ERROR 404</p>
      <h1>This route does not exist.</h1>
      <p>
        The interactive room may be unavailable on this device, but the standard portfolio and terminal are still available.
      </p>
      <nav aria-label="Recovery navigation">
        <a href="/">Return home</a>
        <a href="/portfolio/">Open portfolio</a>
        <a href="/terminal/">Open terminal</a>
      </nav>
    </main>
  </body>
</html>
